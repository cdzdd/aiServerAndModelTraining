[project]
name = "qa-backend"
version = "0.1.0"
description = "FastAPI foundation for the knowledge question-answering service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.115,<1",
  "httpx2>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<0.5",
  "sentence-transformers==5.2.0",
  "transformers==4.57.6",
  "torch==2.9.1",
  "pydantic-settings>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "tokenizers>=0.22,<0.23",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "python-dotenv>=1.2,<2",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
