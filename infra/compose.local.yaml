x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-application: &application
  image: qa-backend:${RUNTIME_IMAGE_TAG:?Run via scripts/deploy/local-run.mjs}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file: ../.env
  environment: &environment
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    PUBLIC_ORIGIN: http://127.0.0.1:${WEB_PORT}
    UPLOAD_DIR: /data/uploads
    EMBEDDING_MODEL_PATH: /models/bge
    EMBEDDING_TOKENIZER_PATH: /models/bge/tokenizer.json
    MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
    MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://host.docker.internal:11434}
    MODEL_API_KEY: ""
  volumes:
    - uploads:/data/uploads
    - type: bind
      source: ${BGE_HOST_PATH:?Set EMBEDDING_MODEL_PATH to an existing BGE directory}
      target: /models/bge
      read_only: true
      bind:
        create_host_path: false
  extra_hosts:
    - host.docker.internal:host-gateway
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  init: true
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  api:
    <<: *application
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g

  parse-worker:
    <<: *application
    command: [python, -m, app.modules.ingestion.worker]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1g

  index-worker:
    <<: *application
    command: [python, -m, app.modules.retrieval.indexing]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 2g

  web:
    image: qa-web:${RUNTIME_IMAGE_TAG:?Run via scripts/deploy/local-run.mjs}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:?Set a unique WEB_PORT}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  uploads:
