x-budget-logging: &budget-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  api:
    mem_limit: 576m
    memswap_limit: 576m
    cpus: 0.75
    environment:
      OMP_NUM_THREADS: "1"
    logging: *budget-logging
  parse-worker:
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.25
    environment:
      OMP_NUM_THREADS: "1"
    logging: *budget-logging
  index-worker:
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.75
    environment:
      OMP_NUM_THREADS: "1"
    logging: *budget-logging
  db:
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.20
    logging: *budget-logging
  web:
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.05
    logging: *budget-logging
