name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d qa_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://qa:ci-local-only@127.0.0.1:5432/qa_test
      TEST_DATABASE_URL: postgresql+psycopg://qa:ci-local-only@127.0.0.1:5432/qa_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      UPLOAD_DIR: .local/ci-uploads
      API_PORT: 8101
      WEB_PORT: 5201
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          python-version: '3.12'
      - name: Install locked Python dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the same checks as local development
        run: node scripts/dev.mjs check
      - name: Verify lock files did not change
        run: git diff --exit-code -- backend/uv.lock frontend/package-lock.json
